# Swing Screener configuration.
# Parameters here are fixed before any statistics/backtesting is run — do not
# hand-tune against results. See docs/PLAN.md for the meaning of each parameter.

paths:
  run_db: "data/run.db"
  research_db: "data/research.db"
  state_dir: "state"
  reports_dir: "reports"
  raw_cache_dir: "data/raw"
  logs_dir: "data/logs"

edgar:
  max_requests_per_second: 4
  daily_index_lookback_days: 10   # how far back to search for the latest published index

prices:
  live_lookback_days: 300
  research_start_date: "2014-01-01"
  retry_pause_seconds: 5
  chunk_size: 100

universe:
  min_price: 5.0
  min_market_cap: 1_000_000_000
  min_adv20_dollars: 20_000_000
  min_history_days: 126
  exclude_sic_codes: [6770]
  exclude_name_patterns:
    - "acquisition corp"
    - "acquisition co"
    - "spac"
    - " warrant"
    - " units"
    - " preferred"

regime:
  spy_sma_days: 200
  breadth_sma_days: 50

modules:
  a_momentum_pullback:
    enabled: true
    rs_lookback_days: 126
    rs_skip_recent_days: 21
    rs_top_pct: 0.20
    pct_of_52w_high_max: 0.25
    sma_fast: 20
    sma_slow: 50
  b_earnings_gap_drift:
    enabled: true
    min_gap_pct: 0.05
    min_volume_multiple: 2.0
    hold_days_min: 2
    hold_days_max: 5
  c_insider_cluster:
    enabled: true
    min_distinct_insiders: 2
    min_txn_value: 50_000
    min_cluster_total_value: 250_000
    cluster_window_days: 30
    sma_confirm_days: 20
    atr_stop_multiple: 2.0
  d_base_breakout:
    enabled: true
    pct_of_52w_high_max: 0.15
    base_min_weeks: 3
    base_max_weeks: 8
    min_volume_multiple: 1.5
    atr_stop_multiple: 2.0
  stop_distance_pct_min: 0.02
  stop_distance_pct_max: 0.12

guardrail:
  shares_growth_yoy_max: 0.10
  debt_to_op_income_max: 5.0

ranking:
  weight_setup_quality: 0.45
  weight_relative_strength: 0.35
  weight_overlap: 0.20
  overlap_score_1_module: 0
  overlap_score_2_modules: 70
  overlap_score_3plus_modules: 100
  track_record_min_closed_trades: 30
  track_record_weight_once_unlocked: 0.10
  max_per_industry: 2
  earnings_window_trading_days: 25

trade_plan:
  target_r_multiple: 2.0
  partial_exit_fraction: 0.5
  time_stop_trading_days: 20
  entry_validity_trading_days: 5
  exit_sma_days: 20

tracking:
  round_trip_cost_pct: 0.001
  sector_etfs:
    Technology: XLK
    Financials: XLF
    Health Care: XLV
    Consumer Discretionary: XLY
    Consumer Staples: XLP
    Energy: XLE
    Industrials: XLI
    Materials: XLB
    Utilities: XLU
    Real Estate: XLRE
    Communication Services: XLC

baseline:
  samples_per_recommendation: 3
  random_seed: 20240101

report:
  top_n_favorable: 10
  top_n_caution: 5
  top_n_unfavorable: 0
  max_per_industry: 2

llm:
  max_input_tokens_per_stock: 6000
  briefs_top_n: 10
