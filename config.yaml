# Swing Screener configuration.
# Parameters here are fixed before any statistics/backtesting is run — do not
# hand-tune against results. See docs/PLAN.md for the meaning of each parameter.

paths:
  run_db: "data/run.db"
  research_db: "data/research.db"
  state_dir: "state"
  reports_dir: "reports"
  raw_cache_dir: "data/raw"
  logs_dir: "data/logs"

daily:
  max_catchup_days: 5            # missed trading days processed per daily run; the rest wait for the next run

edgar:
  max_requests_per_second: 4
  daily_index_lookback_days: 10   # how far back to search for the latest published index

prices:
  live_lookback_days: 300
  research_start_date: "2014-01-01"
  retry_pause_seconds: 5
  chunk_size: 100

universe:
  min_price: 5.0
  min_market_cap: 1_000_000_000
  min_adv20_dollars: 20_000_000
  min_history_days: 126
  exclude_sic_codes: [6770]
  exclude_name_patterns:
    - "acquisition corp"
    - "acquisition co"
    - "spac"
    - " warrant"
    - " units"
    - " preferred"

regime:
  spy_sma_days: 200
  breadth_sma_days: 50
  breadth_threshold_pct: 50       # breadth is "OK" when >= this % of the universe is above its 50-day SMA

modules:
  a_momentum_pullback:
    enabled: true
    rs_lookback_days: 126
    rs_skip_recent_days: 21
    rs_top_pct: 0.20
    pct_of_52w_high_max: 0.25
    sma_fast: 20
    sma_slow: 50
    pullback_touch_window: 5      # sessions (ending on the trigger day) that may touch the SMA
    pullback_touch_pct: 0.02      # a low within 2% above the SMA counts as a touch
    pullback_close_floor: 0.97    # closes must stay above 97% of the SMA
    sma_slope_sessions: 10        # the 50-day SMA must be rising over this many sessions
    stop_atr_buffer: 0.1          # stop = pullback low - 0.1 ATR
  b_earnings_gap_drift:
    enabled: true
    min_gap_pct: 0.05
    min_volume_multiple: 2.0
    hold_days_min: 2
    hold_days_max: 5
    tight_range_atr_multiple: 1.5
    stop_atr_buffer: 0.1             # stop = max(gap-day low, consolidation/pullback low) - 0.1 ATR
    gap_close_min_range_position: 0.5  # gap-day close must sit in the upper half of its high-low range
    prefer_8k_window_days: 3         # a calendar row within 3 days of an 8-K 2.02 event defers to the 8-K
    pullback_trigger_enabled: true   # second trigger: first pullback to the SMA after the gap, then reclaim
    pullback_window_sessions: 30     # the reclaim must come within 30 sessions of the gap
    pullback_sma_days: [10, 20]      # a low touching the higher of these SMAs counts as the pullback
    pullback_touch_pct: 0.02         # a low within 2% above the SMA counts as a touch (as in module A)
    surprise_max_points: 10.0        # earnings surprise adds -10..+10 setup points; no data -> 0
    surprise_eps_saturation: 0.20    # EPS surprise of +-20% vs the Nasdaq forecast saturates
    surprise_sue_saturation: 2.0     # revenue SUE (seasonal random walk) of +-2 saturates
  c_insider_cluster:
    enabled: true
    min_distinct_insiders: 2
    min_txn_value: 50_000
    min_cluster_total_value: 250_000
    cluster_window_days: 30
    sma_confirm_days: 20
    atr_stop_multiple: 2.0
    completion_window_sessions: 20   # trigger must come within this many sessions of the cluster completing
    stop_lookback_sessions: 10       # recent swing low window for the stop
  d_base_breakout:
    enabled: true
    pct_of_52w_high_max: 0.15
    base_min_weeks: 3
    base_max_weeks: 8
    min_volume_multiple: 1.5
    atr_stop_multiple: 2.0
    contraction_ratio: 0.7           # ATR at the end of the base < 0.7x ATR before it
  stop_distance_pct_min: 0.02
  stop_distance_pct_max: 0.12

guardrail:
  shares_growth_yoy_max: 0.10
  debt_to_op_income_max: 5.0

ranking:
  weight_setup_quality: 0.45
  weight_relative_strength: 0.35
  weight_overlap: 0.20
  overlap_score_1_module: 0
  overlap_score_2_modules: 70
  overlap_score_3plus_modules: 100
  track_record_min_closed_trades: 30
  track_record_weight_once_unlocked: 0.10
  max_per_industry: 2
  earnings_window_trading_days: 25

trade_plan:
  target_r_multiple: 2.0
  partial_exit_fraction: 0.5
  time_stop_trading_days: 20
  entry_validity_trading_days: 5
  exit_sma_days: 20

earnings:
  policy: "skip"                   # "skip": drop a candidate whose next known earnings falls inside the window; "flag": only flag it
  min_sessions_before: 10          # window = entry validity + 10 sessions after the signal (point-in-time known dates only)

tracking:
  round_trip_cost_pct: 0.001
  sector_etfs:
    Technology: XLK
    Financials: XLF
    Health Care: XLV
    Consumer Discretionary: XLY
    Consumer Staples: XLP
    Energy: XLE
    Industrials: XLI
    Materials: XLB
    Utilities: XLU
    Real Estate: XLRE
    Communication Services: XLC

baseline:
  samples_per_recommendation: 3
  random_seed: 20240101

measurement:
  forward_horizons: [5, 10, 20, 40, 60]   # trading days from the signal's next open (state/forward_returns)
  bootstrap_iterations: 2000              # cluster bootstrap (resampling signal weeks) for 95% CIs
  bootstrap_seed: 20240101
  ci_level: 0.95
  min_n_for_evidence: 30                  # below this the evidence label is "insufficient"
  min_weeks_for_evidence: 4               # distinct signal weeks needed as well

report:
  top_n_favorable: 10
  top_n_caution: 5
  top_n_unfavorable: 0
  max_per_industry: 2

llm:
  max_input_tokens_per_stock: 6000
  briefs_top_n: 10
